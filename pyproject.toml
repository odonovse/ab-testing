[project]
name = "ab-testing"
version = "0.1.0"
description = "AB-Testing Package with Frequentist and Bayesian Methodologies, including SRM checks, CUPED adjustments, Winsorisation"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Séamus O'Donovan", email = "odonovse@tcd.ie" }]
keywords = ["ab-testing", "experimentation", "statistics", "frequentist", "bayesian", "t-test", "cuped", "srm", "winsorisation", "fixed effects", "welch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/odonovse/ab-testing"
Source = "https://github.com/odonovse/ab-testing"
Issues = "https://github.com/odonovse/ab-testing/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ab_testing"]
