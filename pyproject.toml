[project]
name = "ab-testing"
version = "0.1.0"
description = "Frequentist and Bayesian A/B testing over raw or summary inputs."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ab_testing"]
